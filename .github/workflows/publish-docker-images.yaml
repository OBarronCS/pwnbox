name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - { base: "25.04", default: false }
          - { base: "25.10", default: false }
          - { base: "26.04", default: true }

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:

      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare tags for normal version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,ubuntu${{ matrix.version.base }},prefix=
            type=ref,event=tag
            # Need to specify prefix here: https://github.com/docker/metadata-action/issues/270
            type=sha,prefix=ubuntu${{ matrix.version.base }}-
            type=raw,value=latest,enable=${{ matrix.version.default }},prefix=
          flavor: |
            latest=false
            prefix=ubuntu${{ matrix.version.base }}-,onlatest=false

      # Prepare tags for WSL version
      - name: WSL Docker meta
        id: meta_wsl
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=wsl-ubuntu${{ matrix.version.base }},prefix=
            type=ref,event=tag
            type=sha,prefix=wsl-ubuntu${{ matrix.version.base }}-
            type=raw,value=wsl,enable=${{ matrix.version.default }},prefix=
          flavor: |
            latest=false
            prefix=wsl-ubuntu${{ matrix.version.base }}-,onlatest=false

      - name: Normal image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          build-args: |
            UBUNTU_VERSION=${{ matrix.version.base }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.version.base }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version.base }}

      - name: WSL image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: wsl
          build-args: |
            UBUNTU_VERSION=${{ matrix.version.base }}
          pull: true
          push: true
          tags: ${{ steps.meta_wsl.outputs.tags }}
          labels: ${{ steps.meta_wsl.outputs.labels }}
          cache-from: type=gha,scope=wsl_${{ matrix.version.base }}
          cache-to: type=gha,mode=max,scope=wsl_${{ matrix.version.base }}
  
  release:
    permissions:
      contents: write
      packages: read

    needs: build-and-push-image
    uses: ./.github/workflows/release-wsl-filesystem.yaml
    with:
      tag: ${{ github.ref_name }}
      