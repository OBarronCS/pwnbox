name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - { base: 25.04, default: false }
          - { base: 26.04, default: true }

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:

      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prepare tags for normal version
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,ubuntu${{ matrix.version.base }},prefix=
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ matrix.version.default }}
          flavor:
            prefix=ubuntu${{ matrix.version.base }}-,onlatest=false

      # Prepare tags for WSL version
      - name: WSL Docker meta
        id: meta_wsl
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=wsl-ubuntu${{ matrix.version.base }},prefix=
            type=ref,event=tag
            type=sha
            type=raw,value=wsl,enable=${{ matrix.version.default }}
          flavor: |
            prefix=wsl-ubuntu${{ matrix.version.base }}-
            latest=false

      - name: Normal image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          build-args: |
            UBUNTU_VERSION=${{ matrix.version.base }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: WSL image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wsl
          build-args: |
            UBUNTU_VERSION=${{ matrix.version.base }}
          pull: true
          push: true
          tags: ${{ steps.meta_wsl.outputs.tags }}
          labels: ${{ steps.meta_wsl.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
