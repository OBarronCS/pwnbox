name: Publish Full Docker Image

on:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-full-image:
    runs-on: ubuntu-latest
    
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        version:
          - { base: "26.04", default: true }
          
    steps:

      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=full-ubuntu${{ matrix.version.base }},prefix=
            type=ref,event=tag
            type=sha,prefix=full-ubuntu${{ matrix.version.base }}-
            type=raw,value=full,enable=${{ matrix.version.default }},prefix=
          flavor: |
            latest=false
            prefix=full-ubuntu${{ matrix.version.base }}-,onlatest=false

      - name: Full image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: wsl
          build-args: |
            UBUNTU_VERSION=${{ matrix.version.base }}
            FULL_BUILD=true
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
