name: Extract and Release WSL tarball

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release"
        required: true
  workflow_run:
    workflows: ["Publish Docker Images"]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine tag
      id: get-tag
      run: |
        # workflow_run trigger
        if [ -n "${GITHUB_EVENT_WORKFLOW_RUN_HEAD_TAG}" ]; then
          echo "tag=${GITHUB_EVENT_WORKFLOW_RUN_HEAD_TAG}" >> "$GITHUB_OUTPUT"
        # manual trigger
        elif [ -n "${GITHUB_EVENT_INPUT_TAG}" ]; then
          echo "tag=${GITHUB_EVENT_INPUT_TAG}" >> "$GITHUB_OUTPUT"
        else
          echo "No tag provided!"
          exit 1
        fi

    - name: Set up Docker CLI
      uses: docker/setup-buildx-action@v2

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract file system from container
      id: run-container
      run: |
        docker create --name wsl-temp ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:wsl
        docker export wsl-temp -o wsl_rootfs.tar
        docker rm wsl-temp
        gzip -9 -v wsl_rootfs.tar
        ls -pla

    - name: release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # @v1
      with:
        name: WSL root filesystem - ${{ steps.get-tag.outputs.tag }}
        tag_name: ${{ steps.get-tag.outputs.tag }}
        files: |
          ./wsl_rootfs.tar.gz
        body: "Follow the steps [here](https://github.com/OBarronCS/pwnbox?tab=readme-ov-file#step-2---create-a-wsl-distro-with-the-tar-file) to use this .tar.gz file to create a WSL distro!"
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}
