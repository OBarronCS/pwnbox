name: Extract and Release WSL tarball

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      github_token:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

      # Username must be lowercase
    - name: Sanitize repo slug
      uses: actions/github-script@v8
      id: repo_slug
      with:
        result-encoding: string
        script: return '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'.toLowerCase()

    - name: Set up Docker CLI
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract file system from container
      id: run-container
      run: |
        docker create --name wsl-temp ${{ steps.repo_slug.outputs.result }}:wsl
        docker export wsl-temp -o wsl_rootfs.tar
        docker rm wsl-temp
        gzip -9 -v wsl_rootfs.tar
        ls -pla

    - name: release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # @v1
      with:
        files: |
          ./wsl_rootfs.tar.gz
        body: "Follow the steps [here](https://github.com/OBarronCS/pwnbox?tab=readme-ov-file#step-2---create-a-wsl-distro-with-the-tar-file) to use this .tar.gz file to create a WSL distro!"
        name: "WSL root filesystem"
        draft: false
        tag_name: ${{ inputs.tag }}
        token: ${{ secrets.GITHUB_TOKEN }}